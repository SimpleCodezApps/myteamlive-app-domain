<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SimpleCodez Analytics</title>
  <link rel="icon" href="images/AnalyticsIcon.png" type="image/png">
  <link rel="apple-touch-icon" href="images/AnalyticsIcon.png">
  <style>
    :root {
      --bg: #252a34;        /* minimal-mistakes dark skin background */
      --hero-bg: #1a1a2e;   /* main site hero overlay color */
      --text: #eaeaea;
      --link: #8cd2d5;
      --accent: #00adb5;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", "Helvetica Neue", "Lucida Grande", Arial, sans-serif;
      line-height: 1.5;
    }
    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 320px;
      padding: 3em 1em;
      background: var(--hero-bg) url("images/Header.png") center / cover no-repeat;
      text-align: center;
    }
    .btn {
      display: inline-block;
      padding: 0.75em 1.5em;
      color: #fff;
      font-weight: bold;
      text-decoration: none;
      background: transparent;
      border: 1px solid #fff;
      border-radius: 4px;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
    }
    .btn:hover { background: rgba(0, 0, 0, 0.2); }
    .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="hero">
    <!-- TODO: point at the real download URL (App Store link) -->
    <a class="btn" href="#">Download</a>
  </main>
</body>
</html>
