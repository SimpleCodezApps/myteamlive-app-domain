<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyTeamLive Analytics</title>
  <link rel="icon" href="images/AnalyticsIcon.png" type="image/png">
  <link rel="apple-touch-icon" href="images/AnalyticsIcon.png">
  <style>
    :root {
      --bg: #252a34;        /* minimal-mistakes dark skin background */
      --hero-bg: #1a1a2e;   /* main site hero overlay color */
      --text: #eaeaea;
      --link: #8cd2d5;
      --accent: #00adb5;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { min-height: 100vh; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", "Helvetica Neue", "Lucida Grande", Arial, sans-serif;
      line-height: 1.5;
    }
    .hero {
      position: relative;
      flex: 1;
      min-height: 320px;
      background: var(--hero-bg) url("images/Header.png") center / cover no-repeat;
    }
    .download {
      position: absolute;
      left: 54px;
      bottom: 54px;
      line-height: 0;
    }
    .download:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .download img { display: block; }
  </style>
</head>
<body>
  <main class="hero">
    <a class="download" href="https://apps.apple.com/app/apple-store/id6751442892?pt=127996740&amp;ct=myteamlive-web&amp;mt=8">
      <img src="images/Download_on_the_App_Store_Badge_US-UK_RGB_wht_092917.svg" alt="Download on the App Store">
    </a>
  </main>
</body>
</html>
